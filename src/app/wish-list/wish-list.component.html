<div class="card">
  <div class="card-header">
    <h3 class="text-center">WishList</h3>
  </div>
  <div class="card-body">
    @if (this.wishItems.length === 0) {
      <p class="text-black text-center">WishList is Empty</p>
    } @else {
      <div class="list-group">
        @for (item of this.wishItems; track item.title; let i = $index) {
          <div class="list-group-item d-flex gap-3 align-items-start">
           <img *ngIf="item.image" [src]="item.image" alt="{{ item.title }}" width="80" height="80" class="rounded border">
            <div class="flex-grow-1">
              <h5 class="mb-1">{{ item.title }}</h5>
              <p class="mb-1 text-muted">{{ item.description }}</p>
              <div class="d-flex justify-content-between">
                <div>
                  <strong>Price:</strong> ${{ item.price }}<br>
                  <strong>In Stock:</strong> {{ item.rating }}
                </div>
               <button
               class="btn btn-outline-danger" (click)="onAddToCart()">Add to cart</button>

              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
